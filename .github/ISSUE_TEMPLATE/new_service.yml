name: Add a service
description: Suggest a subscription service Dues should know about
title: "[Service] <Name>"
labels: ["catalog"]
body:
  - type: input
    id: name
    attributes: {label: Service name and website, placeholder: "Proton Mail – proton.me"}
    validations: {required: true}
  - type: textarea
    id: plans
    attributes: {label: Plans and prices, description: "Plan names, prices, billing cycle and country, with an official source link"}
    validations: {required: true}
